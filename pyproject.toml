[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pact-refinement"
version = "0.1.0"
description = "Deliverable-value credit assignment for segmentation refinement"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.15,<2"]
[tool.setuptools.packages.find]
include = ["pact*"]
